services:
  postgres:
    image: postgres:17-alpine
    container_name: vcraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vcraft_db}
      POSTGRES_USER: ${POSTGRES_USER:-vcraft_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vcraft_secret_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - vcraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vcraft_user} -d ${POSTGRES_DB:-vcraft_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vcraft-network

  reverse-proxy:
    image: nginx:1.26-alpine
    container_name: vcraft-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_uploads:/var/www/uploads:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vcraft-network

volumes:
  vcraft_pgdata:
    name: vcraft_pgdata
  media_uploads:
    name: vcraft_media_uploads

networks:
  vcraft-network:
    name: vcraft-network
    driver: bridge
