server {
    listen 80;
    server_name localhost;

    # SEC-14: Giới hạn kích thước tải lên tối đa 6 MiB
    client_max_body_size 6M;

    # SEC-12: Header bảo mật cơ bản
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Backend API: Chuyển tiếp request /api/ tới NestJS Backend
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Media Uploads (Read-only volume theo SEC-10)
    location /uploads/ {
        alias /var/www/uploads/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400";
        autoindex off;
    }

    # Frontend SPA & Vite HMR WebSocket: Chuyển tiếp tới Vite Dev Server
    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
