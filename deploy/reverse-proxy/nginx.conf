map $request_id $problem_tracking_id {
    "~^(?<a>[0-9a-f]{8})(?<b>[0-9a-f]{4})[0-9a-f](?<c>[0-9a-f]{3})[0-9a-f](?<d>[0-9a-f]{3})(?<e>[0-9a-f]{12})$" "$a-$b-4$c-8$d-$e";
}

server {
    listen 80;
    client_max_body_size 6M;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        error_page 413 = @api_payload_too_large;
        proxy_pass http://backend:3000;
    }

    location @api_payload_too_large {
        default_type application/problem+json;
        return 413 '{"type":"urn:vcraft:problem:PAYLOAD_TOO_LARGE","title":"Dữ liệu quá lớn","status":413,"detail":"Giảm kích thước dữ liệu rồi thử lại.","code":"PAYLOAD_TOO_LARGE","tracking_id":"$problem_tracking_id"}';
    }

    location /uploads/ {
        return 404;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
